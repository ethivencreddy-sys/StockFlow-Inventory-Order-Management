
services:
  auth-service:
    build: ./services/auth-service
    image: stockflow-auth:latest
    container_name: stockflow-auth
    ports:
      - "8011:8001"
    environment:
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY in .env}
    volumes:
      - ./services/auth-service/data:/app/data
    networks:
      - stockflow-network

  product-service:
    build: ./services/product-service
    image: stockflow-product:latest
    container_name: stockflow-product
    ports:
      - "8012:8002"
    volumes:
      - ./services/product-service:/app/data
    networks:
      - stockflow-network

  inventory-service:
    build: ./services/inventory-service
    image: stockflow-inventory:latest
    container_name: stockflow-inventory
    ports:
      - "8013:8003"
    environment:
      DATABASE_URL: sqlite:////app/data/inventory.db
    volumes:
      - ./services/inventory-service:/app/data
    networks:
      - stockflow-network

  cart-service:
    build: ./services/cart-service
    image: stockflow-cart:latest
    container_name: stockflow-cart
    ports:
      - "8014:8004"
    environment:
      DATABASE_URL: sqlite:////app/data/cart.db
    volumes:
      - ./services/cart-service:/app/data
    networks:
      - stockflow-network

  order-service:
    build: ./services/order-service
    image: stockflow-order:latest
    container_name: stockflow-order
    ports:
      - "8015:8005"
    environment:
      DATABASE_URL: sqlite:////app/data/orders.db
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY in .env}
      RABBITMQ_URL: amqp://stockflow:${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}@stockflow-rabbitmq:5672/%2F
    volumes:
      - ./services/order-service:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - stockflow-network

  order-worker:
    build: ./services/order-service
    image: stockflow-order:latest
    container_name: stockflow-order-worker
    command: ["python", "-m", "app.worker"]
    environment:
          DATABASE_URL: sqlite:////app/data/orders.db
          AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?Set AUTH_SECRET_KEY in .env}
          RABBITMQ_URL: amqp://stockflow:${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}@stockflow-rabbitmq:5672/%2F
    volumes:
      - ./services/order-service:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - stockflow-network

  payment-service:
    build: ./services/payment-service
    image: stockflow-payment:latest
    container_name: stockflow-payment
    ports:
      - "8016:8006"
    environment:
      DATABASE_URL: sqlite:////app/data/payments.db
    volumes:
      - ./services/payment-service:/app/data
    networks:
      - stockflow-network

  notification-service:
    build: ./services/notification-service
    image: stockflow-notification:latest
    container_name: stockflow-notification
    ports:
      - "8017:8007"
    environment:
      DATABASE_URL: sqlite:////app/data/notifications.db
    volumes:
      - ./services/notification-service:/app/data
    networks:
      - stockflow-network

  review-service:
    build: ./services/review-service
    image: stockflow-review:latest
    container_name: stockflow-review
    ports:
      - "8018:8008"
    environment:
      DATABASE_URL: sqlite:////app/data/reviews.db
    volumes:
      - ./services/review-service:/app/data
    networks:
      - stockflow-network

  coupon-service:
    build: ./services/coupon-service
    image: stockflow-coupon:latest
    container_name: stockflow-coupon
    ports:
      - "8019:8009"
    environment:
      DATABASE_URL: sqlite:////app/data/coupons.db
    volumes:
      - ./services/coupon-service:/app/data
    networks:
      - stockflow-network

  analytics-service:
    build: ./services/analytics-service
    image: stockflow-analytics:latest
    container_name: stockflow-analytics
    ports:
      - "8020:8010"
    environment:
      ANALYTICS_TOKEN_FILE: /app/data/.analytics_token
      API_GATEWAY_URL: http://stockflow-gateway:8000
      ORDER_SERVICE_URL: http://stockflow-order:8005
      PRODUCT_SERVICE_URL: http://stockflow-product:8002
      INVENTORY_SERVICE_URL: http://stockflow-inventory:8003
    volumes:
      - ./services/analytics-service:/app/data
    networks:
      - stockflow-network

  return-service:
    build: ./services/return-service
    image: stockflow-return:latest
    container_name: stockflow-return
    ports:
      - "8021:8011"
    environment:
      DATABASE_URL: sqlite:////app/data/returns.db
    volumes:
      - ./services/return-service/data:/app/data
    networks:
      - stockflow-network

  api-gateway:
    build: ./api-gateway
    image: stockflow-gateway:latest
    container_name: stockflow-gateway
    ports:
      - "8022:8000"
    environment:
      AUTH_SERVICE_URL: http://stockflow-auth:8001
      PRODUCT_SERVICE_URL: http://stockflow-product:8002
      INVENTORY_SERVICE_URL: http://stockflow-inventory:8003
      CART_SERVICE_URL: http://stockflow-cart:8004
      ORDER_SERVICE_URL: http://stockflow-order:8005
      PAYMENT_SERVICE_URL: http://stockflow-payment:8006
      NOTIFICATION_SERVICE_URL: http://stockflow-notification:8007
      REVIEW_SERVICE_URL: http://stockflow-review:8008
      COUPON_SERVICE_URL: http://stockflow-coupon:8009
      ANALYTICS_SERVICE_URL: http://stockflow-analytics:8010
      RETURN_SERVICE_URL: http://stockflow-return:8011
      REDIS_URL: redis://stockflow-redis:6379/0
      RATE_LIMIT: 120
      RATE_LIMIT_WINDOW: 60
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - stockflow-network

  frontend:
    build: ./frontend
    image: stockflow-frontend:latest
    container_name: stockflow-frontend
    ports:
      - "5175:80"
    networks:
      - stockflow-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: stockflow-rabbitmq
    hostname: stockflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: stockflow
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS in .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stockflow-network

  redis:
    image: redis:7-alpine
    container_name: stockflow-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stockflow-network

networks:
  stockflow-network:
    external: true
    name: stockflow-network


volumes:
  rabbitmq_data:
  redis_data:
